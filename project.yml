name: Barefoot
options:
  bundleIdPrefix: dev.krishtimil
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
settings:
  base:
    MARKETING_VERSION: "1.0"
    CURRENT_PROJECT_VERSION: "1"
targets:
  Barefoot:
    type: application
    platform: iOS
    sources: [Barefoot]
    info:
      path: Barefoot/Info.plist
      properties:
        CFBundleDisplayName: Barefoot
        NSBluetoothAlwaysUsageDescription: Connects to your scale to read the weight.
        NSHealthUpdateUsageDescription: Saves your weigh-ins to Apple Health.
        NSHealthShareUsageDescription: Reads your recent weight history to draw the trend.
        ITSAppUsesNonExemptEncryption: false
        LSApplicationCategoryType: public.app-category.healthcare-fitness
        UILaunchScreen: {}
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
    entitlements:
      path: Barefoot/Barefoot.entitlements
      properties:
        com.apple.developer.healthkit: true
        com.apple.developer.healthkit.access: []
    settings:
      base:
        SWIFT_VERSION: "5.0"
        TARGETED_DEVICE_FAMILY: "1"
        CODE_SIGN_STYLE: Automatic
        DEVELOPMENT_TEAM: "793QWV9G2U"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        ENABLE_USER_SCRIPT_SANDBOXING: YES
        SWIFT_TREAT_WARNINGS_AS_ERRORS: NO
